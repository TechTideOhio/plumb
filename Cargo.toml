[package]
name = "plumb-eval"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Paired statistical significance, bootstrapped confidence intervals, exact McNemar tests, and TOST equivalence gating for TideOS Eval Kit"
license = "MIT"
authors = ["Alex Cinovoj <alex@techtideai.io>"]
repository = "https://github.com/TechTideOhio/plumb"
homepage = "https://techtideai.io"
readme = "README.md"
keywords = ["evals", "statistics", "bootstrap", "mcnemar", "tideos"]
categories = ["command-line-utilities", "development-tools::testing"]

[[bin]]
name = "plumb"
path = "src/main.rs"

[lib]
name = "plumb"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"

[dev-dependencies]
rstest = { version = "0.23", default-features = false }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
format_push_string = "allow"
uninlined_format_args = "allow"
if_not_else = "allow"
assigning_clones = "allow"
comparison_chain = "allow"
collapsible_if = "allow"
too_many_arguments = "allow"
manual_div_ceil = "allow"
explicit_counter_loop = "allow"
many_single_char_names = "allow"
inconsistent_digit_grouping = "allow"
excessive_precision = "allow"
manual_clamp = "allow"
cast_lossless = "allow"
redundant_closure_for_method_calls = "allow"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
